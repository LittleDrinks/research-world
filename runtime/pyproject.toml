[project]
name = "research-agent-runtime"
version = "0.1.0a3"
description = "ACP agent runtime for Research World"
requires-python = ">=3.12,<3.14"
dependencies = [
  "agent-client-protocol[http]==0.12.1",
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "hypercorn==0.17.3",
  "jsonschema==4.25.1",
  "mcp>=1.0,<2",
  "pyyaml==6.0.3",
]

[dependency-groups]
dev = [
  "pytest==8.4.2",
  "pytest-asyncio==1.1.0",
  "respx==0.23.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
