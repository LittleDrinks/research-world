[project]
name = "research-agent-runtime"
version = "0.1.0a3"
description = "Pi agent runtime for Research World"
requires-python = ">=3.12,<3.14"
dependencies = [
  "docker==7.2.0",
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "hypercorn==0.17.3",
  "jsonschema==4.25.1",
  "research-kernel-contract==0.1.0",
]

[dependency-groups]
dev = [
  "pillow==12.3.0",
  "pytest==8.4.2",
  "pytest-asyncio==1.1.0",
  "respx==0.23.1",
]
workspace = [
    "psutil==7.2.2",
    "ipykernel==7.4.0",
    "jupyterlab==4.6.4",
    "matplotlib==3.11.2",
    "numpy==2.5.4",
]

[tool.uv.sources]
research-kernel-contract = { path = "../research-world/kernel-contract" }

[tool.pytest.ini_options]
pythonpath = [".", "../research-world"]
testpaths = ["tests"]
asyncio_mode = "auto"
