name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: release
        name: Resolve image names
        shell: bash
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish control and worker image
        uses: docker/build-push-action@v6
        with:
          context: research-world
          target: runtime
          push: true
          tags: |
            ghcr.io/${{ steps.release.outputs.owner }}/research-world:${{ steps.release.outputs.version }}
            ghcr.io/${{ steps.release.outputs.owner }}/research-world:pre-alpha
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
      - name: Publish runner image
        uses: docker/build-push-action@v6
        with:
          context: research-world
          target: runner
          push: true
          tags: |
            ghcr.io/${{ steps.release.outputs.owner }}/research-world:${{ steps.release.outputs.version }}-runner
            ghcr.io/${{ steps.release.outputs.owner }}/research-world:pre-alpha-runner
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
      - name: Publish agent runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: runtime/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.release.outputs.owner }}/research-world-runtime:${{ steps.release.outputs.version }}
            ghcr.io/${{ steps.release.outputs.owner }}/research-world-runtime:pre-alpha
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
      - name: Create prerelease
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          body: |
            ## Docker
            ```bash
            docker pull ghcr.io/${{ steps.release.outputs.owner }}/research-world:${{ steps.release.outputs.version }}
            docker pull ghcr.io/${{ steps.release.outputs.owner }}/research-world:${{ steps.release.outputs.version }}-runner
            docker pull ghcr.io/${{ steps.release.outputs.owner }}/research-world-runtime:${{ steps.release.outputs.version }}
            ```
            ```bash
            RW_VERSION=${{ steps.release.outputs.version }} docker compose -f research-world/compose.release.yaml up -d
            ```
