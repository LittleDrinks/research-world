name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: research-world/web/package-lock.json
      - name: Test research world
        working-directory: research-world
        run: |
          uv sync --frozen --dev
          uv run pytest -q
      - name: Test agent runtime
        working-directory: runtime
        run: |
          uv sync --frozen --dev
          uv run pytest -q
      - name: Test SciFact product adapter
        run: |
          uv sync --project benchmarks --frozen
          uv run --project benchmarks python -m pytest -q benchmarks/tests
      - name: Build web
        working-directory: research-world/web
        run: |
          npm ci
          npm run build
      - name: Validate Compose
        working-directory: research-world
        run: |
          docker compose config -q
      - name: Browser smoke against Compose
        run: |
          mkdir -p "$HOME/.pi/agent" "$HOME/.agents/skills"
          echo '{"defaultProvider":"ci","defaultModel":"model"}' > "$HOME/.pi/agent/settings.json"
          echo '{"providers":{"ci":{"baseUrl":"http://127.0.0.1:1/v1","api":"openai-completions","apiKey":"unused-ci","models":[{"id":"model","name":"CI","contextWindow":4096,"maxTokens":1024}]}}}' > "$HOME/.pi/agent/models.json"
          cd research-world
          docker compose up --build -d --wait
          cd web
          npx playwright install --with-deps chromium
          RW_WORKSPACE_LIVE=1 npm test
      - name: Workspace operation integration
        working-directory: runtime
        run: RW_DOCKER_TEST=1 uv run pytest -q tests/test_workspace_execution.py
      - name: Test server workspace gateway
        working-directory: research-world
        run: |
          docker compose -f compose.yaml -f compose.server.yaml up -d --wait
          cd web
          RW_SERVER_TEST=1 RW_TEST_URL=http://127.0.0.1 npm test -- tests/server-workspace.spec.js
          cd ../../runtime
          RW_GATEWAY_TEST=1 uv run pytest -q tests/test_workspace_gateway.py
      - name: Stop Compose
        if: always()
        working-directory: research-world
        run: docker compose -f compose.yaml -f compose.server.yaml down --remove-orphans
