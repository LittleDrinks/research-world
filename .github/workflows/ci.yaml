name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: research-world/web/package-lock.json
      - name: Test research world
        working-directory: research-world
        run: |
          uv sync --frozen --dev
          uv run pytest -q
      - name: Test agent runtime
        working-directory: runtime
        run: |
          uv sync --frozen --dev
          uv run pytest -q
      - name: Build web
        working-directory: research-world/web
        run: |
          npm ci
          npm run build
      - name: Validate Compose
        working-directory: research-world
        run: |
          docker compose config -q
      - name: Browser smoke against Compose
        run: |
          mkdir -p "$HOME/.pi/agent" "$HOME/.agents/skills"
          echo '{"defaultProvider":"ci","defaultModel":"model"}' > "$HOME/.pi/agent/settings.json"
          echo '{"providers":{"ci":{"baseUrl":"http://127.0.0.1:1/v1","api":"openai-completions","apiKey":"unused-ci","models":[{"id":"model","name":"CI","contextWindow":4096,"maxTokens":1024}]}}}' > "$HOME/.pi/agent/models.json"
          cd research-world
          docker compose up --build -d --wait
          cd web
          npx playwright install --with-deps chromium
          npm test
      - name: Stop Compose
        if: always()
        working-directory: research-world
        run: docker compose down
