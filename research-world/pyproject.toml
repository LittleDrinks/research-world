[project]
name = "research-world"
version = "0.1.0a1"
description = "A data-centered control plane for scientific research agents"
requires-python = ">=3.12,<3.14"
dependencies = [
  "agent-client-protocol[http]==0.12.1",
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "jsonschema==4.25.1",
  "json-repair==0.62.0",
  "markdown==3.10.3",
  "mcp>=1.0,<2",
  "pyyaml==6.0.3",
  "python-dotenv==1.1.1",
  "uvicorn[standard]==0.35.0",
  "pybtex>=0.26.1",
]

[project.scripts]
rw = "server.cli:entrypoint"

[dependency-groups]
dev = [
  "pytest==8.4.2",
  "pytest-asyncio==1.1.0",
  "respx==0.23.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server", "worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
