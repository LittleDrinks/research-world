id: research
name: 规划与验证
stages:
  - id: plan
    type: prompt
    agent: research-assistant
    output: experiment-plan
  - id: execute
    type: tool
    tool: isolated-container
    policy: mechanical-audit
  - id: review
    type: prompt
    agent: independent-reviewer
    repeat: 2
    policy: unanimous-review
    on:
      approve: {action: admit}
      reject: {action: ghost}
      conflict: {action: wait_human}
  - id: reflect
    type: prompt
    agent: research-assistant
    output: next-direction
