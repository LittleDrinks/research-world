id: brainstorm
name: 生成研究方向
stages:
  - id: generate
    type: prompt
    prompt: generate-directions
    agent: research-assistant
  - id: deduplicate
    type: tool
    tool: deduplicate-directions
    policy:
      name: cosine-threshold
      params: {block: 0.8, review: 0.6}
  - id: select
    type: tool
    tool: select-directions
    policy:
      name: mmr
      params: {weight: 0.2}
  - id: review
    type: prompt
    prompt: review-directions
    agent: independent-reviewer
    repeat: 2
    policy: unanimous-review
    'on':
      approve: {action: admit}
      reject: {action: ghost}
      conflict: {action: wait_human}
