services:
  control:
    build:
      context: .
      target: runtime
    environment:
      RW_PROJECTS_ROOT: /projects
      RW_DATA_ROOT: /app/data
      RUNTIME_URL: http://runtime:8098
    ports:
    - 127.0.0.1:8095:8095
    volumes:
    - rw-kernel-data:/app/data
    - rw-project-workspaces:/projects
    networks:
    - control
    - worker-egress
    depends_on:
      runtime:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8095/api/v1/health')
      interval: 5s
      timeout: 3s
      retries: 20
    command:
    - uvicorn
    - server.app:app
    - --host
    - 0.0.0.0
    - --port
    - '8095'
  runtime:
    depends_on:
      workspace-image:
        condition: service_completed_successfully
    build:
      context: ..
      dockerfile: runtime/Dockerfile
      target: runtime
    environment:
      RUNTIME_DATA: /runtime-data
      RW_WORKSPACE_IMAGE: ${COMPOSE_PROJECT_NAME:-research-world}-workspace:local
      RW_WORKSPACE_PREFIX: ${COMPOSE_PROJECT_NAME:-research-world}
      CONTROL_URL: http://control:8095
      PI_CODING_AGENT_DIR: /home/runtime/.pi/agent
      RUNTIME_SKILLS_PATHS: /app/skills:/user-agent-skills
    ports:
    - 127.0.0.1:8098:8098
    volumes:
    - rw-runtime-data:/runtime-data
    - /var/run/docker.sock:/var/run/docker.sock
    - rw-project-workspaces:/projects
    - ${HOME}/.pi/agent:/pi-source:ro
    - ${HOME}/.agents/skills:/user-agent-skills:ro
    networks:
    - control
    - worker-egress
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8098/health')
      interval: 5s
      timeout: 3s
      retries: 20
  workspace-image:
    network_mode: none
    image: ${COMPOSE_PROJECT_NAME:-research-world}-workspace:local
    build:
      context: ..
      dockerfile: runtime/Dockerfile
      target: workspace
    entrypoint: ["python", "-c", "print('Workspace image ready')"]
    healthcheck:
      disable: true

volumes:
  rw-kernel-data: null
  rw-projects: null
  rw-runtime-data: null
  rw-project-workspaces: null
networks:
  control:
    internal: true
  worker-egress: null
